{% extends "base.html" %}
{% block title %}Mail · Mail Notify{% endblock %}
{% block content %}
<section class="access-card" aria-labelledby="status-heading">
    <div class="access-icon"><i class="fa-solid {{ 'fa-envelope' if status.beep else 'fa-inbox' }}" aria-hidden="true"></i></div>
    <div class="access-content">
        <h2 id="status-heading">{{ status.message }}</h2>
        {% if status.error %}<p>{{ status.error }}</p>{% endif %}
    </div>
    <a class="button primary" href="/">Check again <i class="fa-solid fa-rotate-right" aria-hidden="true"></i></a>
</section>
{% endblock %}
