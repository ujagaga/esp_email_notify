<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mail Notify{% endblock %}</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/solid.min.css">
    <link rel="icon" href="/static/favicon.ico">
</head>
<body>
    <header class="site-header">
        <nav class="container navigation" aria-label="Main navigation">
            <a class="brand" href="/"><span class="brand-icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>Mail Notify<span class="brand-dot">.</span></a>
            <div class="nav-links">
                {% if email %}
                    <a class="nav-action" href="/config" aria-label="Configuration" title="Configuration" {% if request.endpoint == 'config_page' %}aria-current="page"{% endif %}><i class="fa-solid fa-gear" aria-hidden="true"></i></a>
                    <a class="nav-action" href="/logout" aria-label="Log out" title="Log out"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i></a>
                    <span class="avatar nav-avatar" role="img" aria-label="Signed in as {{ email }}" title="{{ email }}">{{ email[0]|upper }}</span>
                {% endif %}
            </div>
        </nav>
    </header>
    <main id="main" class="container main-content">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<div class="notification" role="status"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>{{ message }}</span></div>{% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
